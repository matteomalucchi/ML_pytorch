# Example configuration for a k-fold training (see the "K-fold training"
# section of the README).
#
# The events are split into k_folds folds by event number (event % k_folds,
# here 2 folds: even and odd events). The model of fold k is trained on the
# other folds and tested on fold k, so every event gets an out-of-fold score.
# The non-test events are split into training and validation with the ratio
# train_fraction : val_fraction (test_fraction is not used).

input_variables: sig_bkg_dnn_input_variables

run2: False

signal_sample: [GluGlutoHHto4B_spanet_skimmed]
signal_dataset: [GluGlutoHHto4B_spanet_kl-1p00_kt-1p00_c2-0p00_2022_postEE]
signal_region: [4b_signal_region]

background_sample: [DATA_JetMET_JMENano_E_skimmed, DATA_JetMET_JMENano_F_skimmed]
background_dataset: [DATA_JetMET_JMENano_E_2022_postEE_EraE, DATA_JetMET_JMENano_F_2022_postEE_EraF]
background_region: [2b_signal_region_postW]

ML_model: DNN_softmax_reweight_model

data_format: coffea

k_folds: 2
kfold_split: event
kfold_event_column: event

# oversampling of the signal, done after the split into folds in the
# training and validation datasets only
split_oversample: True

batch_size: 512
epochs: 50

learning_rate: 1e-3
learning_rate_schedule: e5_drop75

early_stopping: True
patience: 5
min_delta: 1e-5

eval_param: "loss"

train_fraction: 0.8
val_fraction: 0.2
test_fraction: 0.0
