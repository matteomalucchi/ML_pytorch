# Default configuration of ml_train.
# Every option can be overridden in the config file passed with -c, and most of
# them also from the command line (command line > config file > these defaults).

# ---------------------------------------------------------------------------
# Input variables
# ---------------------------------------------------------------------------

# Input features of the model. Either an explicit list of column names
# (jagged collections are selected as "<collection>_<var>:<position>", e.g.
# "JetGood_pt:0"), or the name of a module in ml_pytorch/defaults/ (e.g.
# sig_bkg_dnn_input_variables) whose dnn_input_variables dict is converted
# into the list of column names.
input_variables:
    [JetGood_pt, JetGood_eta, JetGood_phi, JetGood_mass, JetGood_btagPNetB]

# Preprocessing functions applied to single input variables when loading the
# data, as {variable: [function_name, [extra_args]]}. The function is taken
# from ml_pytorch/defaults/preprocess_variables_functions.py and called as
# function(values, *extra_args), e.g. {var: [arctanh, []]}.
preprocess_variables_functions: {}

# If True, the column names built from an input_variables module use the
# Run2 naming (e.g. "JetGoodRun2_pt" instead of "JetGood_pt").
run2: False

# ---------------------------------------------------------------------------
# Signal and background samples
# ---------------------------------------------------------------------------

# Samples (first level of the "columns" of the .coffea files) used as signal
# and background. Only used with data_format coffea.
signal_sample: [VBF_HHto4B]
background_sample: [GluGlutoHHto4B]

# Regions (categories) from which the signal and background events are taken.
signal_region: [4b_region]
background_region: [4b_region]

# Datasets used as signal and background. They are used to select the input
# .coffea files (by name) and the datasets inside them (and, for parquet, the
# parquet directories). Every listed dataset must be found.
# The kl (or C2V) value is extracted from the dataset name and stored for
# each event (9999 if not present).
signal_dataset: [VBFHHto4B_CV_1_C2V_1_C3_1_2022_postEE]
background_dataset: [GluGlutoHHto4B_kl-1p00_kt-1p00_c2-0p00__2022_postEE]

# Multi-class layout. If set, it replaces the signal_*/background_* options
# above: each entry defines one class (and one output node of the model) as
#   <class name>: {sample: [...], region: [...], dataset: [...], lbl: <int>}
# The classes are ordered by lbl. With more than two classes a model whose
# get_model accepts num_classes is needed (e.g. DNN_multiclass_model).
# See configs/hh4b_sig_bkg_classifier/example_DNN_config_multiclass.yml.
classes: null

# Directories containing the input files (.coffea files and, for parquet, the
# config.json pointing to the parquet chunks).
data_dirs: [/work/mmalucch/out_hh4b/out_vbf_ggf_dnn_full/]

# Parquet only: directory of the parquet files to use instead of the one in
# the config.json of data_dirs (only with a single data_dir), e.g. the output
# of merge_parquet.py of AnalysisConfigs (utils_configs/merge_parquet.py),
# which merges the many small chunks into a single file per dataset/region and
# makes the loading much faster. Not needed if the merged files were written
# in the config.json (merge_parquet.py --update-config).
parquet_dir: null

# Format of the input data: coffea or parquet (root is not supported anymore).
data_format: coffea

# If True, the inputs are saved without systematic variations, if False only
# the "nominal" variation is read:
#   coffea : the columns are stored directly under the region (True) or under
#            the "nominal" variation (False), i.e.
#            columns[sample][dataset][region]["nominal"]
#   parquet: the chunks are read directly from <dataset>/<region>/ (True; no
#            variation subdirectory is expected) or only from
#            <dataset>/<region>/nominal/ (False; the other variations are
#            skipped)
novars: False

# ---------------------------------------------------------------------------
# Train / validation / test split
# ---------------------------------------------------------------------------

# Fractions of the total events used for training, validation and testing.
# They must sum to <= 1; the remaining events are discarded.
train_fraction: 0.5
val_fraction: 0.25
test_fraction: 0.25

# ---------------------------------------------------------------------------
# K-fold training
# ---------------------------------------------------------------------------
# With k_folds >= 2 the events are split into k_folds folds: the model of fold
# k is tested on the events of fold k and trained/validated on all the other
# events, which are split into training and validation with the ratio
# train_fraction : val_fraction (test_fraction is not used, the sum of the
# three fractions is still the fraction of the events that is read). In this
# way every event gets an unbiased (out-of-fold) score. The event shuffling
# and the folds are fixed by seed (the same for all the folds), while the
# weight initialisation (and dropout) of fold k uses its own independent
# random stream, seeded with numpy SeedSequence([seed, k]).
# The outputs of each fold go to <output_dir>/fold_<k>, the combined
# out-of-fold results to <output_dir>/kfold and the ONNX models (per fold and
# combined) to <output_dir>/kfold_onnx. 0 or 1 disables the k-folding.
k_folds: 0
# Fold to train (0 ... k_folds - 1). If null, all the folds are trained one
# after the other and then merged (see also jobs/run_training.sh --k-folds to
# train them in parallel and ml_kfold_merge to merge them).
fold: null
# How the events are assigned to the folds:
#   random: randomly, after the (seeded) shuffling of the events
#   event : fold = event number % k_folds, using the kfold_event_column column
#           (e.g. with k_folds 2 the even and odd events). The model of fold k
#           has not seen the events with event % k_folds == k, so it is the
#           one to apply to them; a combined ONNX model taking the event
#           number as second input does this automatically.
kfold_split: random
# Column with the event number, used with kfold_split: event.
kfold_event_column: event
# Build also the ONNX models of the average of the ratio of the outputs of
# the folds (p / (1 - p) for 1 output node, p1 / p0 for 2), used for the
# background reweighting.
onnx_ratio: False
# Combination of the folds of the final ONNX model of the k-fold training,
# recorded in <output_dir>/kfold/kfold_summary.yml (final_onnx). The models
# are saved as <output_dir>/kfold_onnx/kfold_<type>_<combination>.onnx, with
# <type> classifier, morphing_ratio (onnx_ratio) or
# morphing_ttbar_subtracted (morphing_alpha), and <combination> average,
# all_folds (the outputs of every fold, not averaged) or event_fold; the
# final model is kfold_<type>_average.onnx or kfold_<type>_event_fold.onnx:
#   average: average over the folds of the outputs (of their ratio with
#            onnx_ratio: True). For events not used in the training, e.g. the
#            background reweighting applied in a separate region.
#   event  : the model of the fold event % k_folds, i.e. the one not trained
#            on the event (second input: int64 event number). For events used
#            in the training, e.g. the sig/bkg or ggF/VBF classifiers. Events
#            never seen in the training can be evaluated with any fold.
#            Needs kfold_split: event.
kfold_onnx: average
# K-fold, 4-node multiclass morphing (classes data num., data den., ttbar
# num., ttbar den., see the README): ttbar fraction alpha = N_ttbar / N_data of
# the numerator region and of the denominator region (computed by ml_alpha,
# or automatically by jobs/run_training.sh --alpha). If morphing_alpha is set,
# the final k-fold ONNX model is the morphing weight
#   w = relu(r_0 - alpha * r_2) / relu(r_1 - alpha_den * r_3)
# (averaged over the folds as ml_onnx -ar -mc does, or of the fold of the
# event with kfold_onnx: event). morphing_alpha_den 0.0 switches off the ttbar
# subtraction in the denominator.
morphing_alpha: null
morphing_alpha_den: 0.0
# Directory of the k-fold cache. If set, the events are loaded, shuffled and
# assigned to the folds only once (ml_train --kfold-prepare, done
# automatically when training all the folds with ml_train or
# jobs/run_training.sh --k-folds) and saved there as .npy files, which every
# fold memory-maps: the events take the RAM only once per node, however many
# folds run in parallel, and each fold keeps only the indices of its events.
# The cache is reused if it was made with the same data, fractions,
# oversampling, seed, k_folds and kfold_split, otherwise ml_train stops.
# ml_train -k K and jobs/run_training.sh --k-folds put the cache in a
# temporary directory ($TMPDIR, node-local on the batch nodes), removed at the
# end, so the large arrays are not written to the output disk.
kfold_cache: null
# Directory where the record of the split is saved when the cache is
# prepared: k.npy ([kl, dataset index, fold] of every event, in the shuffled
# order) and the metadata, for reproducibility. ml_train -k K and
# jobs/run_training.sh use <output dir>/kfold_split.
kfold_split_dir: null
# Only prepare the k-fold cache (see kfold_cache) and exit.
kfold_prepare: False

# ---------------------------------------------------------------------------
# Event weights and class balancing
# ---------------------------------------------------------------------------
# The event weights are first divided by the sum of genweights of their
# dataset (when available). Then, unless one of the oversampling/undersampling
# options below is used, a class weight is computed for signal and background
# such that the total sum of weights is the same for the two classes and the
# average event weight is 1:
#   class_weight = (N_sig + N_bkg) / (2 * sum(w_class))

# If True, the weights of every individual dataset are normalized such that
# sum(w) = 1 for each dataset (summing over all its regions) before the class
# balancing. In this way every dataset contributes equally within its class,
# while the class balancing still makes the total sum of weights of signal
# and background equal.
normalize_weights_per_dataset: False

# Class balancing via resampling. Only one of them can be True. When any of
# them is used, the class weights above are set to 1. The number of events,
# the sum of the weights and the class weights of each class in the training,
# validation and test datasets are printed, to check the balance.
# oversample_split: replicate the signal events to match the number of
#   background events before the train/val/test split, so copies of the same
#   event can end up in different datasets.
#   With k_folds >= 2 the test fold is taken first and never oversampled
#   (every event gets one out-of-fold score, its events get the class weights
#   above instead); the events of the other folds are oversampled and then
#   split into training and validation, so copies of the same event can be
#   both in the training and validation datasets.
oversample_split: False
# split_oversample: replicate the signal events to match the number of
#   background events separately in the train, val and test datasets
#   after the split, so the copies of an event stay in its dataset.
#   With k_folds >= 2 the test fold is not oversampled (see above), the
#   training and validation datasets are oversampled separately.
split_oversample: False
# undersample: keep only as many background events as signal events.
undersample: False

# ---------------------------------------------------------------------------
# Model and training
# ---------------------------------------------------------------------------

# Name of the model module in ml_pytorch/models/ (must define get_model).
ML_model: DNN_model

# Seed of the random number generators (python, numpy and torch, also on
# GPU). Everything random is derived from it, so a training is reproduced by
# its seed:
#   - the event shuffling, the train/val/test split and the oversampling
#     (with the k-folding also the folds and, with a generator seeded by
#     (seed, fold), the train/val split and oversampling of every fold);
#   - the weight initialisation and the dropout (with the k-folding from an
#     independent stream per fold, seeded with SeedSequence([seed, fold]));
#   - a training resumed with --load-model continues exactly as if it had not
#     been interrupted: the checkpoints store the states of the random
#     generators, of the learning rate scheduler and of the early stopper.
# On CPU two trainings with the same seed are identical; on GPU they can
# slightly differ (non-deterministic cuDNN/cuBLAS kernels) unless
# deterministic is True.
seed: 100
# Use only deterministic algorithms (torch.use_deterministic_algorithms and
# cuDNN in deterministic mode), so that trainings with the same seed are
# identical also on GPU. It can make the training slower, and with multiple
# GPUs (DataParallel) the results can still differ.
deterministic: False

batch_size: 512
# Maximum number of training epochs.
epochs: 50

# Initial learning rate (must be positive).
learning_rate: 1e-2
# Learning rate schedule (see ml_pytorch/utils/learning_rate_schedules.py):
#   constant   : constant learning rate
#   linear     : linear decrease from learning_rate to 0 over all the epochs
#   eX_dropYY  : constant for the first X epochs, then multiplied by 0.YY at
#                every epoch, i.e. learning_rate * 0.YY^(epoch - X) from epoch X
#                (epochs counted from 0). X is any integer number of epochs,
#                YY any digits, read as the decimals of the factor:
#                  e20_drop95 -> 20 epochs, factor 0.95
#                  e5_drop75  -> 5 epochs,  factor 0.75
#                  e10_drop5  -> 10 epochs, factor 0.5
#                  e10_drop05 -> 10 epochs, factor 0.05
#                  e0_drop99  -> factor 0.99 from the first epoch
#   wX_cosineYY: linear warm-up from learning_rate/X to learning_rate in the
#                first X epochs, then cosine decay down to learning_rate * 0.YY
#                at the last epoch (epochs - 1); wX_cosine decays down to 0.
#                Suited to long trainings (with a patience large enough not to
#                stop the training while the learning rate is still high):
#                  w5_cosine01 -> 5 warm-up epochs, down to 0.01 * learning_rate
learning_rate_schedule: linear

# Stop the training if the validation metric (eval_param) does not improve
# by more than min_delta for patience consecutive epochs.
early_stopping: False
patience: 5
min_delta: 1e-5

# Validation metric used to select the best model and for the early stopping:
# loss (validation loss) or acc (validation accuracy).
eval_param: "loss"

# Number of best-epoch checkpoints (state_dict/model_<epoch>_state_dict.pt)
# kept on disk: when a new best epoch is saved, the oldest ones are removed.
# The checkpoint of the last epoch is always kept. 0 keeps all of them.
n_best_checkpoints: 5

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------

# Number of worker processes of the DataLoaders.
num_workers: 4
# Use pinned memory in the DataLoaders (faster transfer to GPU).
pin_memory: False
# Reshuffle the order of the training events at every epoch (also with
# data_on_gpu and in the k-fold training). The permutations are drawn from the
# torch random number generator seeded with `seed`, so trainings with the same
# seed see the same batches (also when resumed). The validation and test
# loaders are never shuffled.
shuffle_train: False
# Comma-separated list of GPU indices to use (e.g. '0' or '0,1'; more than one
# GPU uses DataParallel), or 'cpu' to run on CPU. For the small models used
# here DataParallel is usually slower than a single GPU: to use several GPUs
# run several trainings (seeds) in parallel, one per GPU
# (jobs/run_training.sh --gpus-per-node).
gpus: '0'
# Copy the whole train/val/test datasets to the GPU once and take the batches
# directly from there, instead of using DataLoader workers and copying every
# batch to the GPU. Much faster for small models; num_workers and pin_memory
# are then not used. If the datasets take more than half of the free GPU
# memory they are kept in RAM and the batches are taken as slices there and
# copied to the GPU one by one (still much faster than the DataLoaders, which
# index and collate the events one by one). No effect on CPU. False uses the
# standard DataLoaders.
data_on_gpu: True
# Allow TensorFloat-32 matrix multiplications on Ampere (or newer) GPUs
# (ignored with deterministic: True).
tf32: True

# ---------------------------------------------------------------------------
# Padding
# ---------------------------------------------------------------------------

# Padded inputs (e.g. kinematics of missing jets) are handled by the
# `MaskedBatchNorm1d` input layer of the model (see
# models/DNN_multiclass_model.py). pad_fill_value and pad_indicators are used
# ONLY by this layer: they are passed to get_model() only if the model's
# get_model() accepts them (multi-class models), and are ignored otherwise
# (e.g. models with a plain nn.BatchNorm1d). The whole padding treatment lives
# inside the model, so the exported ONNX takes the raw padded inputs directly.

# Value marking padded (missing) entries of the inputs. Must match the
# PocketCoffea fill value. It is used:
#   - when loading the dataset: the objects requested with "<var>:<position>"
#     that an event does not have, the missing objects of a whole jagged
#     collection used as input (coffea only, padded to the maximum number of
#     objects per event), and any None value of the inputs, are set to this
#     value;
#   - when creating a missing <collection>_N input from the parquet files:
#     the objects equal to this value (or None) are not counted;
#   - in MaskedBatchNorm1d: the entries equal to this value are excluded from
#     the batch and running mean/variance, so they don't bias the
#     normalisation, and are then replaced by pad_fill_value;
#   - in the input variable plots: the entries equal to this value are not
#     plotted (the plots use the default -999).
pad_value: -999.0
# Value given to the padded entries at the output of MaskedBatchNorm1d, i.e.
# in the same space as the normalised real values. The real values are
# standardised ((x - mean) / std of the real values) and then multiplied and
# shifted by the learnable weight and bias of the layer: at the start of the
# training they have mean 0 and std 1, so 0.0 is where the mean of the real
# values is mapped. It is a fixed number, though: it does not follow the
# learned weight and bias, so during the training it is not the mean of the
# normalised real values anymore. Use "learn" to make it a learnable parameter
# per feature (initialised to 0).
pad_fill_value: 0.0
# If True, append one 0/1 flag per input feature (1 = real value, 0 = padded),
# so the first linear layer receives 2 * n_input_features inputs. Lets the
# network distinguish a padded entry from a real one equal to pad_fill_value.
pad_indicators: True

# ---------------------------------------------------------------------------
# Evaluation and outputs
# ---------------------------------------------------------------------------

# Evaluate the best model on the training and test datasets after the training.
eval: True
# Plot the histograms of the model score for signal and background (also per kl value).
histos: True
# Plot the ROC curves.
roc: True
# Save also the ROC points (tpr_fpr*.npz next to the ROC plots), e.g. to
# replot them later. Off by default, to keep the outputs small; also
# ml_train / ml_kfold_merge / ml_sb / jobs/run_training.sh --save-roc.
save_roc: False
# Plot the training history (loss, accuracy and learning rate vs epoch).
history: True
# Plot the input variable distributions of signal and background before the training
input_plots: True
# Subdirectory of the output directory where the input variable plots are saved.
input_plots_dir: input_variables
# Number of bins of the input variable plots.
input_plots_bins: 30
# Use a log scale for the y axis of the input variable plots.
input_plots_log: False
# Export the best model to ONNX.
onnx: True

# Path to a saved model (.pt) to evaluate without training. If empty, the
# model is trained.
eval_model: ''
# Path to a saved model checkpoint (.pt) from which to resume the training.
load_model: ''
# Path to the python file defining the model when using eval_model or
# load_model. If empty, the ML_model.py saved in the output directory is used.
ml_model_path: ''

# Output directory. If null, it is /work/$USER/out_ML_pytorch/<config name>
# (or ./out/<config name> if /work/$USER does not exist).
output_dir: null
# Overwrite the output directory if it already exists without asking.
overwrite: False

# Logging verbosity: debug, info or warning.
verbosity: info
